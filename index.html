<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shefra AI</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--bg2:#e6ebf7;--card:rgba(255,255,255,.8);--tx:#14172a;--mu:#6a7089;--ac:#5b5cf0;--ac2:#18c5b8;--bd:rgba(20,23,42,.1);--me:linear-gradient(135deg,#5b5cf0,#7b6cf6);--mex:#fff;--glow:rgba(91,92,240,.25);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c16;--bg2:#141836;--card:rgba(28,32,56,.72);--tx:#eef0ff;--mu:#9aa0c3;--ac:#8b8cff;--ac2:#2ee6d6;--bd:rgba(255,255,255,.09);--glow:rgba(139,140,255,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c16;--bg2:#141836;--card:rgba(28,32,56,.72);--tx:#eef0ff;--mu:#9aa0c3;--ac:#8b8cff;--ac2:#2ee6d6;--bd:rgba(255,255,255,.09);--glow:rgba(139,140,255,.3);color-scheme:dark}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(24,197,184,.18),transparent 60%),var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100%;width:100%;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin:10px 12px 0;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.6px}
.orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ac));box-shadow:0 0 18px var(--glow);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 16px var(--glow),0 0 0 0 transparent}50%{box-shadow:0 0 38px var(--ac),0 0 70px var(--glow)}}
.hi .orb,.brand .orb.on{animation:spin 8s linear infinite,glow 2.6s ease-in-out infinite}
.brand .orb.busy{animation:spin 2.5s linear infinite,glow 1s ease-in-out infinite}
.brand i{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;align-items:center;gap:10px}
.pill{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px;min-width:84px}
.bar{height:4px;border-radius:4px;background:var(--bd);overflow:hidden}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.about{border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.about:hover{border-color:var(--ac);color:var(--ac)}
#log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hi{margin:auto;text-align:center;padding:20px}
.hi .orb{width:76px;height:76px;margin:0 auto 18px;box-shadow:0 0 50px var(--glow)}
.hi h1{font-size:clamp(24px,6vw,34px);margin:0 0 8px;font-weight:800}
.hi h1 i{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hi p{margin:0;color:var(--mu);font-size:15px}
.m{max-width:90%;padding:12px 16px;border-radius:20px;line-height:1.9;font-size:15.5px;word-break:break-word;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.u{align-self:flex-start;background:var(--me);color:var(--mex);border-bottom-right-radius:6px;white-space:pre-wrap;box-shadow:0 6px 20px var(--glow)}
.a{align-self:flex-end;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-left-radius:6px}
.a p{margin:0 0 .6em}.a p:last-child{margin:0}
.a ul,.a ol{margin:.3em 0 .6em;padding-inline-start:22px}
.a code{background:var(--bd);padding:1px 6px;border-radius:6px;font-family:Consolas,monospace;font-size:13.5px;direction:ltr;unicode-bidi:embed}
.a pre{background:rgba(0,0,0,.35);color:#e8eaff;padding:12px;border-radius:12px;overflow-x:auto;direction:ltr;text-align:left;margin:.5em 0}
.a pre code{background:none;padding:0;color:inherit}
.a h3{margin:.4em 0;font-size:16px}
.act{margin-top:8px;display:flex;gap:12px}
.act button{border:0;background:none;color:var(--ac);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
.dots{display:inline-flex;gap:5px;padding:6px 0}.dots span{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:b 1.1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.pay{align-self:center;text-align:center;max-width:380px;border:1px solid var(--ac);background:var(--card);border-radius:22px;padding:22px;box-shadow:0 10px 40px var(--glow)}
.pay h2{margin:0 0 6px;font-size:20px}.pay p{margin:0 0 14px;color:var(--mu);line-height:1.8;font-size:14.5px}
.pay .price{font-size:30px;font-weight:800;margin-bottom:4px}.pay .price small{font-size:14px;color:var(--mu);font-weight:400}
.btn{display:inline-block;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),#6a5cf0);padding:12px 26px;border-radius:14px;box-shadow:0 6px 20px var(--glow)}
.btn.wa{background:linear-gradient(135deg,#1fb85a,#12924a);box-shadow:0 6px 20px rgba(31,184,90,.3)}
form{display:flex;align-items:flex-end;gap:8px;margin:6px 12px 12px;padding:8px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:16px;padding:9px 10px;max-height:140px;line-height:1.6}
textarea::placeholder{color:var(--mu)}
#go{width:44px;height:44px;flex:none;border:0;border-radius:14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 4px 16px var(--glow)}
#go:disabled{opacity:.45;cursor:default}
#go svg{width:20px;height:20px;transform:scaleX(-1)}
.ov{position:fixed;inset:0;background:rgba(5,6,15,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;padding:20px;z-index:20}
.ov.on{display:grid}
.box{max-width:360px;width:100%;text-align:center;background:var(--bg2);border:1px solid var(--bd);border-radius:24px;padding:26px;animation:in .25s ease}
.box .orb{margin:0 auto 14px}
.box h3{margin:0 0 8px;font-size:19px}.box p{margin:0 0 18px;color:var(--mu);line-height:1.8}
.box .x{display:block;margin:12px auto 0;background:none;border:0;color:var(--mu);font:inherit;cursor:pointer}
@media (min-width:700px){header,form{margin-inline:0}header{margin-top:16px}form{margin-bottom:18px}}
.un{font-size:13px;color:var(--mu);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){.un{display:none}}
.gp{font-size:12px;color:var(--mu);margin:14px 0 0}
.gerr{color:#f87171;margin:12px 0 0;font-size:13px;min-height:1em}
.g{display:inline-flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand"><div class="orb" id="horb"></div><span>SHEFRA <i>AI</i></span></div>
<div class="hr"><span class="un" id="un"></span><button class="about" id="out" type="button" hidden>خروج</button><button class="about" id="about" type="button">حول</button></div>
</header>
<div id="log"><div class="hi" id="hi"><div class="orb"></div><h1>أهلاً بيك في <i>شفرة</i></h1><p>اسألني في أي حاجة، وأنا أجاوبك.</p></div></div>
<form id="f"><textarea id="t" rows="1" placeholder="اكتب رسالتك..."></textarea><button id="go" type="submit" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button></form>
</div>
<div class="ov" id="gate"><div class="box"><div class="orb"></div><h3>سجّل دخولك عشان تبدأ</h3><p>الدخول بحساب جوجل بياخد ثانية واحدة.</p><button class="btn g" id="gl" type="button">الدخول بحساب جوجل</button><div class="gerr" id="ge"></div><p class="gp">بتسجيل الدخول أنت موافق إننا نحفظ اسمك فقط لتنظيم استخدام الموقع.</p></div></div>
<div class="ov" id="ov"><div class="box"><div class="orb"></div><h3>تم تطوير هذا الموقع بواسطة SHEFRA</h3><p>تحب تتواصل معانا؟ اضغط وابعتلنا على واتساب.</p><a class="btn wa" id="wa" target="_blank" rel="noopener">تواصل عبر واتساب</a><button class="x" id="cl" type="button">إغلاق</button></div></div>
<script>
const API_URL="https://shefra-ai.shefraprogrammer.workers.dev/";
const NUM="201091462051",LIM=Infinity;
const log=document.getElementById("log"),t=document.getElementById("t"),go=document.getElementById("go");
let hist=[],busy=false;
const wa=m=>"https://wa.me/"+NUM+"?text="+encodeURIComponent(m);
document.getElementById("wa").href=wa("السلام عليكم ورحمة الله وبركاته، أنا جاي من موقع SHEFRA AI وحابب أتواصل معاكم.");
const ov=document.getElementById("ov");
document.getElementById("about").onclick=()=>ov.classList.add("on");
document.getElementById("cl").onclick=()=>ov.classList.remove("on");
ov.onclick=e=>{if(e.target===ov)ov.classList.remove("on")};
const day=()=>new Date().toISOString().slice(0,10);
function used(){try{const d=JSON.parse(localStorage.getItem("shefra_u")||"{}");return d.d===day()?d.n:0}catch(e){return 0}}
function bump(){try{localStorage.setItem("shefra_u",JSON.stringify({d:day(),n:used()+1}))}catch(e){}}
function ui(){}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
const blocks=[];s=esc(s).replace(/```[\w-]*\n?([\s\S]*?)(```|$)/g,(_,c)=>{blocks.push(c.replace(/\n$/,""));return "\u0000"+(blocks.length-1)+"\u0000"});
const inl=x=>x.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
let out="",list=null;const close=()=>{if(list){out+="</"+list+">";list=null}};
s.split("\n").forEach(l=>{let m;
if(m=l.match(/^\u0000(\d+)\u0000$/)){close();out+="<pre><code>"+blocks[m[1]]+"</code></pre>"}
else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){close();out+="<ul>";list="ul"}out+="<li>"+inl(m[1])+"</li>"}
else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();out+="<ol>";list="ol"}out+="<li>"+inl(m[1])+"</li>"}
else if(m=l.match(/^#{1,4}\s+(.*)/)){close();out+="<h3>"+inl(m[1])+"</h3>"}
else if(l.trim()===""){close()}
else{close();out+="<p>"+inl(l)+"</p>"}});
close();return out}
function add(c,html,isHtml){const d=document.createElement("div");d.className="m "+c;if(isHtml)d.innerHTML=html;else d.textContent=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function paywall(){
if(log.querySelector(".pay"))return;
const d=document.createElement("div");d.className="pay";
d.innerHTML='<h2>خلصت رسايل النهاردة 🚀</h2><p>استخدمت الـ 100 رسالة المجانية. اشترك عشان تكمل من غير حدود.</p><div class="price">200 جنيه <small>/ شهرياً</small></div><p></p><a class="btn wa" target="_blank" rel="noopener">اشترك دلوقتي</a>';
d.querySelector("a").href=wa("السلام عليكم ورحمة الله وبركاته، أنا استخدمت الرسائل المجانية في SHEFRA AI وعايز أشترك في الاشتراك الشهري.");
log.appendChild(d);log.scrollTop=log.scrollHeight}
t.addEventListener("input",()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"});
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();document.getElementById("f").requestSubmit()}});
document.getElementById("f").addEventListener("submit",async e=>{
e.preventDefault();const q=t.value.trim();if(!q||busy)return;
if(used()>=LIM){paywall();return}
const h=document.getElementById("hi");if(h)h.remove();document.getElementById("horb").classList.add("on","busy");
busy=true;go.disabled=true;t.value="";t.style.height="auto";add("u",q);hist.push({role:"user",content:q});
const out=add("a",'<div class="dots"><span></span><span></span><span></span></div>',true);
let h2=hist.slice(-20);if(h2[0].role!=="user")h2=h2.slice(1);
try{
const tok=await window.getToken();if(!tok){window.showGate();throw new Error("auth")}
const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({messages:h2})});
if(res.status===401){window.showGate();throw new Error("auth")}
if(res.status===429)throw{code:"rate_limited"};
if(!res.ok)throw new Error("api");
const r=await res.json();
const txt=r.text||"";out.innerHTML=md(txt);hist.push({role:"assistant",content:txt});bump();ui();
const a=document.createElement("div");a.className="act";const c=document.createElement("button");c.type="button";c.textContent="نسخ";
c.onclick=()=>{try{navigator.clipboard.writeText(txt);c.textContent="تم النسخ ✓"}catch(x){}};a.appendChild(c);out.appendChild(a);
if(used()>=LIM)paywall();
}catch(err){hist.pop();out.textContent=err&&err.code==="rate_limited"?"فيه ضغط دلوقتي، جرب بعد دقيقة.":"حصلت مشكلة، جرب تاني."}
busy=false;go.disabled=false;document.getElementById("horb").classList.remove("busy");t.focus();log.scrollTop=log.scrollHeight});
ui();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBoFoDNsLx-UGxFKMaSNWBCjjR_geXs2bo",authDomain:"shefra-ai.firebaseapp.com",projectId:"shefra-ai",storageBucket:"shefra-ai.firebasestorage.app",messagingSenderId:"118805472184",appId:"1:118805472184:web:9e30d6de84624d8a3aa54d"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),gate=$("gate");
window.getToken=()=>auth.currentUser?auth.currentUser.getIdToken():Promise.resolve(null);
window.showGate=()=>gate.classList.add("on");
$("gl").onclick=async()=>{$("ge").textContent="";try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("ge").textContent="تسجيل الدخول ماكملش، جرب تاني."}};
$("out").onclick=()=>signOut(auth).then(()=>location.reload());
onAuthStateChanged(auth,async u=>{
if(!u){gate.classList.add("on");$("un").textContent="";$("out").hidden=true;return}
gate.classList.remove("on");$("un").textContent=u.displayName||"";$("out").hidden=false;
try{const r=doc(db,"users",u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{name:u.displayName||"بدون اسم",createdAt:serverTimestamp()})}catch(e){}
});
</script>
</body>
</html>
