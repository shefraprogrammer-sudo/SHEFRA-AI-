letters = letters.split("");
let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = [];
for(let x=0; x<columns; x++) drops[x]=1;

function draw() {
    ctx.fillStyle="rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#0F0";
    ctx.font=fontSize+"px monospace";
    for(let i=0;i<drops.length;i++){
        let text=letters[Math.floor(Math.random()*letters.length)];
        ctx.fillText(text,i*fontSize,drops[i]*fontSize);
        if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
    }
}
setInterval(draw,33);

/* ================= GAME LOGIC ================= */
let answers = {};
let askedKeys = [];

function getNextQuestion() {
    let remaining = questions.filter(q => !askedKeys.includes(q.key));
    if (remaining.length === 0) return null;
    return remaining[Math.floor(Math.random() * remaining.length)];
}

function showQ() {
    let currentQ = getNextQuestion();
    if (!currentQ || askedKeys.length >= 12) {
        hackEffect();
        return;
    }
    document.getElementById("question").innerHTML = "";
    typeText(currentQ.text);
    window.currentKey = currentQ.key;
}

function answer(val) {
    answers[window.currentKey] = val;
    askedKeys.push(window.currentKey);
    showQ();
}

function hackEffect() {
    document.getElementById("buttons").classList.add("hidden");
    document.getElementById("question").innerHTML = "";
    typeText("📡 جاري الاتصال بالمستقبل... تم اختراق شيفرة عقلك 🧠", 0, () => {
        setTimeout(guess, 2000);
    });
}

function guess() {
    let bestMatch = null;
    let maxScore = -1;

    people.forEach(p => {
        let score = 0;
        askedKeys.forEach(key => {
            if (p[key] !== undefined && p[key] === answers[key]) score++;
        });
        if(p.real) score += 0.5; // تفضيل الشخصيات الحقيقية

        if (score > maxScore) {
            maxScore = score;
            bestMatch = p;
        }
    });

    document.getElementById("question").innerHTML = "";
    let resultText = bestMatch ? "أنت تفكر في: " + bestMatch.name + " 💀" : "لم أستطع اختراق عقلك هذه المرة!";

}
